name: Tower Breaker fast runtime smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'towerbreaker-fast-trigger/**'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct corrected source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/tb/parts /tmp/tb/project /tmp/tb/runtime
          for n in 00 01 02 03 04; do
            curl -fsSL "https://raw.githubusercontent.com/privacyOG/kivy-python-for-android/tower-breaker-fix-ci/towerbreaker-ci/parts/part${n}" -o "/tmp/tb/parts/part${n}"
          done
          cat /tmp/tb/parts/part* | tr -d '\n\r' | base64 --decode > /tmp/tb/project.zip
          unzip -tq /tmp/tb/project.zip
          unzip -q /tmp/tb/project.zip -d /tmp/tb/project

      - name: Apply final renderer safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/tb/project/app/src/main/java/com/privacyog/towerbreaker/GameView.java')
          s = p.read_text()
          s = s.replace(
              "        if (running) return;\n        running = true;\n        previousNanos = System.nanoTime();\n        removeCallbacks(frameRunnable);\n        post(frameRunnable);\n        invalidate();",
              "        if (running) return;\n        if (!isAttachedToWindow()) {\n            running = false;\n            return;\n        }\n        running = true;\n        previousNanos = System.nanoTime();\n        removeCallbacks(frameRunnable);\n        postOnAnimation(frameRunnable);\n        invalidate();"
          )
          s = s.replace(
              "            if (!running || !isAttachedToWindow()) return;",
              "            if (!running) return;\n            if (!isAttachedToWindow()) {\n                running = false;\n                return;\n            }"
          )
          for token in ('if (!isAttachedToWindow())', 'postOnAnimation(frameRunnable)', 'postOnAnimation(this)', 'protected void onAttachedToWindow()'):
              if token not in s:
                  raise SystemExit('Missing safeguard: ' + token)
          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build corrected APK
        working-directory: /tmp/tb/project
        run: |
          gradle --no-daemon clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/tb/runtime/TowerBreaker-1.0.1-fixed.apk

      - name: Launch title and gameplay on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            adb install -r /tmp/tb/runtime/TowerBreaker-1.0.1-fixed.apk
            adb logcat -c
            adb shell am force-stop com.privacyog.towerbreaker.debug
            adb shell monkey -p com.privacyog.towerbreaker.debug -c android.intent.category.LAUNCHER 1
            sleep 6
            adb shell pidof com.privacyog.towerbreaker.debug
            adb exec-out screencap -p > /tmp/tb/runtime/title-api29.png
            python3 /tmp/tb/project/scripts/check_screenshot.py /tmp/tb/runtime/title-api29.png
            adb shell input tap 900 500
            sleep 3
            adb shell pidof com.privacyog.towerbreaker.debug
            adb exec-out screencap -p > /tmp/tb/runtime/gameplay-api29.png
            python3 /tmp/tb/project/scripts/check_screenshot.py /tmp/tb/runtime/gameplay-api29.png
            adb logcat -d > /tmp/tb/runtime/logcat-api29.txt
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime.*Process: com\.privacyog\.towerbreaker\.debug' /tmp/tb/runtime/logcat-api29.txt

      - name: Record smoke-test verification
        if: success()
        shell: bash
        run: |
          APK=/tmp/tb/runtime/TowerBreaker-1.0.1-fixed.apk
          {
            echo 'RESULT=PASS'
            echo 'RUNTIME=Android 10 API 29 x86_64 emulator'
            echo "SHA256=$(sha256sum "$APK" | awk '{print $1}')"
            echo 'TITLE_SCREEN=NON_BLACK'
            echo 'GAMEPLAY_SCREEN=NON_BLACK'
            echo 'FATAL_LOGCAT=NONE'
          } > /tmp/tb/runtime/verification-api29.txt

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TowerBreaker-1.0.1-fast-runtime-evidence
          path: /tmp/tb/runtime/
          if-no-files-found: error
          retention-days: 14
