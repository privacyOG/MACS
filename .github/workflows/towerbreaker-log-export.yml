name: Export Tower Breaker emulator failure log

on:
  pull_request:
    branches: [main]
    paths:
      - 'towerbreaker-log-trigger/**'

permissions:
  actions: read
  contents: read

jobs:
  export-log:
    runs-on: ubuntu-latest
    steps:
      - name: Download prior emulator job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p output
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/privacyOG/MACS/actions/jobs/89328913243/logs" \
            -o output/job-log.txt
          tail -250 output/job-log.txt > output/job-log-tail.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TowerBreaker-emulator-failure-log
          path: output/
          retention-days: 14
