name: Tower Breaker one-time runtime fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/towerbreaker-runtime-fix-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct Tower Breaker source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/towerbreaker-fix
          mkdir -p /tmp/towerbreaker-fix/parts /tmp/towerbreaker-fix/project /tmp/towerbreaker-fix/runtime
          for n in 00 01 02 03 04; do
            curl -fsSL "https://raw.githubusercontent.com/privacyOG/kivy-python-for-android/tower-breaker-fix-ci/towerbreaker-ci/parts/part${n}" \
              -o "/tmp/towerbreaker-fix/parts/part${n}"
          done
          cat /tmp/towerbreaker-fix/parts/part* | tr -d '\n\r' | base64 --decode > /tmp/towerbreaker-fix/project.zip
          unzip -tq /tmp/towerbreaker-fix/project.zip
          unzip -q /tmp/towerbreaker-fix/project.zip -d /tmp/towerbreaker-fix/project

      - name: Apply attachment-safe frame-loop patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/towerbreaker-fix/project/app/src/main/java/com/privacyog/towerbreaker/GameView.java')
          source = path.read_text()
          source = source.replace(
              "        if (running) return;\n        running = true;\n        previousNanos = System.nanoTime();\n        removeCallbacks(frameRunnable);\n        post(frameRunnable);\n        invalidate();",
              "        if (running) return;\n        if (!isAttachedToWindow()) {\n            running = false;\n            return;\n        }\n        running = true;\n        previousNanos = System.nanoTime();\n        removeCallbacks(frameRunnable);\n        postOnAnimation(frameRunnable);\n        invalidate();"
          )
          source = source.replace(
              "            if (!running || !isAttachedToWindow()) return;",
              "            if (!running) return;\n            if (!isAttachedToWindow()) {\n                running = false;\n                return;\n            }"
          )
          required = [
              'if (!isAttachedToWindow())',
              'postOnAnimation(frameRunnable)',
              'postOnAnimation(this)',
              'protected void onAttachedToWindow()'
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'Missing renderer safeguards: {missing}')
          path.write_text(source)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36 build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile corrected APK
        working-directory: /tmp/towerbreaker-fix/project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee /tmp/towerbreaker-fix/runtime/build.log
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/towerbreaker-fix/runtime/TowerBreaker-1.0.1-fixed.apk

      - name: Install, launch and reject blank screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            APK=/tmp/towerbreaker-fix/runtime/TowerBreaker-1.0.1-fixed.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.privacyog.towerbreaker.debug
            adb shell monkey -p com.privacyog.towerbreaker.debug -c android.intent.category.LAUNCHER 1
            sleep 7
            adb shell pidof com.privacyog.towerbreaker.debug
            adb exec-out screencap -p > /tmp/towerbreaker-fix/runtime/title.png
            python3 /tmp/towerbreaker-fix/project/scripts/check_screenshot.py /tmp/towerbreaker-fix/runtime/title.png
            adb shell input tap 1200 650
            sleep 4
            adb shell pidof com.privacyog.towerbreaker.debug
            adb exec-out screencap -p > /tmp/towerbreaker-fix/runtime/gameplay.png
            python3 /tmp/towerbreaker-fix/project/scripts/check_screenshot.py /tmp/towerbreaker-fix/runtime/gameplay.png
            adb logcat -d > /tmp/towerbreaker-fix/runtime/logcat.txt
            if grep -E 'FATAL EXCEPTION|AndroidRuntime.*Process: com\.privacyog\.towerbreaker\.debug' /tmp/towerbreaker-fix/runtime/logcat.txt; then
              echo 'Runtime crash found in logcat' >&2
              exit 3
            fi

      - name: Export build result and remove one-time workflow
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          rm -rf towerbreaker-output-fix
          mkdir -p towerbreaker-output-fix/apk-parts
          APK=/tmp/towerbreaker-fix/runtime/TowerBreaker-1.0.1-fixed.apk
          {
            echo 'Tower Breaker 1.0.1 corrected build'
            echo "Workflow result: $JOB_STATUS"
            echo 'Build target: Android API 36 / Build Tools 36.0.0 / Java 17'
            echo 'Runtime target: Android API 35 x86_64 Pixel 6 emulator'
          } > towerbreaker-output-fix/verification.txt
          if [ -f "$APK" ]; then
            SHA=$(sha256sum "$APK" | awk '{print $1}')
            SIZE=$(stat -c '%s' "$APK")
            echo "APK SHA-256: $SHA" >> towerbreaker-output-fix/verification.txt
            echo "APK bytes: $SIZE" >> towerbreaker-output-fix/verification.txt
            base64 -w0 "$APK" | split -b 45000 -d -a 3 - towerbreaker-output-fix/apk-parts/part-
          else
            echo 'APK was not produced.' >> towerbreaker-output-fix/verification.txt
          fi
          if [ -s /tmp/towerbreaker-fix/runtime/title.png ]; then
            cp /tmp/towerbreaker-fix/runtime/title.png towerbreaker-output-fix/title.png
            echo 'Title screenshot captured and non-black.' >> towerbreaker-output-fix/verification.txt
          fi
          if [ -s /tmp/towerbreaker-fix/runtime/gameplay.png ]; then
            cp /tmp/towerbreaker-fix/runtime/gameplay.png towerbreaker-output-fix/gameplay.png
            echo 'Gameplay screenshot captured and non-black.' >> towerbreaker-output-fix/verification.txt
          fi
          for file in build.log logcat.txt; do
            [ -f "/tmp/towerbreaker-fix/runtime/$file" ] && cp "/tmp/towerbreaker-fix/runtime/$file" towerbreaker-output-fix/
          done
          rm -f .github/workflows/towerbreaker-runtime-fix-temp.yml
          git config user.name privacyOG
          git config user.email privacyog@users.noreply.github.com
          git add towerbreaker-output-fix .github/workflows/towerbreaker-runtime-fix-temp.yml
          git commit -m "build: export Tower Breaker 1.0.1 runtime fix ($JOB_STATUS)"
          git push origin HEAD:main
