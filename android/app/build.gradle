plugins {
    id "com.android.application"
}

android {
    namespace "com.macs.lawnquote"
    compileSdk 35

    defaultConfig {
        applicationId "com.macs.lawnquote"
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName "1.0.10"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("MACS_LAWNQUOTE_KEYSTORE") ?: "missing-release-key.jks")
            storePassword System.getenv("MACS_LAWNQUOTE_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("MACS_LAWNQUOTE_KEY_ALIAS") ?: "macs-lawnquote"
            keyPassword System.getenv("MACS_LAWNQUOTE_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
