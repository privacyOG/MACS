<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f7a4f" />
    <title>MACS Crew</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page crew-page">
    <header class="topbar">
      <div>

      <div class="top-actions">

        <a class="ghost-button action-link" data-page="schedule" href="schedule.html">Schedule</a>
