<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f7a4f" />
    <title>MACS Invoices</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <div>
        <div class="topbar-logo"><img src="assets/macs-logo.png" alt="MACS Services" /></div>
        <p class="eyebrow">MACS Operations</p>
        <h1>Invoice Queue</h1>
      </div>
      <div class="top-actions">
        <a class="ghost-button action-link" data-page="home" href="index.html">Home</a>
        <a class="ghost-button action-link" data-page="customers" href="customers.html">Customers</a>
        <a class="ghost-button action-link" data-page="schedule" href="schedule.html">Schedule</a>
        <a class="ghost-button action-link" data-page="quote" href="quote.html">New Quote</a>
        <a class="ghost-button action-link" data-page="admin" href="admin.html">Admin</a>
        <a class="ghost-button action-link" data-page="downloads" href="downloads.html">Downloads</a>
        <a class="ghost-button action-link" data-page="profile" href="profile.html">Profile</a>
      </div>
    </header>

    <main class="admin-shell">
      <section class="admin-card schedule-wide">
        <div class="section-head">
          <h2>Approved Jobs Ready To Invoice</h2>
          <span data-auth-label>Loading access</span>
        </div>
        <div id="invoice-stats" class="dashboard-stats"></div>
      </section>

      <section class="admin-card schedule-wide">
        <div class="section-head">
          <h2>Invoice Queue</h2>
          <span>Uses approved roster jobs, worklog time, and materials</span>
        </div>
        <div id="invoice-list" class="invoice-list"></div>
      </section>
    </main>

    <script src="invoices.js" type="module"></script>
  </body>
</html>
